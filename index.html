<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIX Open Source Packages — LibrePower</title>
    <meta
      http-equiv="refresh"
      content="3; url=https://librepower.org/stack/databases-operating-systems/aix/"
    />
    <link
      rel="canonical"
      href="https://librepower.org/stack/databases-operating-systems/aix/"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800;900&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .lp,
      .lp * {
        margin: 0;
        padding: 0;
      }
      .lp {
        font-family: "Work Sans", sans-serif;
        color: #e8e8e8;
        background: #0a0a0b;
        overflow-x: clip;
        --gold: #e9cb8e;
        --gold-d: rgba(233, 203, 142, 0.1);
        --tq: #68aec9;
        --tq-d: rgba(104, 174, 201, 0.08);
        --green: #81c784;
        --muted: #999;
        --dim: #777;
        --border: rgba(255, 255, 255, 0.07);
        font-size: 17px;
        line-height: 1.7;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .lp a {
        text-decoration: none;
        color: inherit;
      }
      .lp h1,
      .lp h2 {
        font-family: "Alexandria", sans-serif;
        line-height: 1.1;
        letter-spacing: -0.03em;
      }
      .lp-label {
        font-family: "Alexandria", sans-serif;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      @keyframes lp-grain {
        0%,
        100% {
          transform: translate(0);
        }
        20% {
          transform: translate(-3%, -8%);
        }
        60% {
          transform: translate(8%, 5%);
        }
        80% {
          transform: translate(-2%, 6%);
        }
      }
      .lp-grain::after {
        content: "";
        position: absolute;
        inset: -50%;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        opacity: 0.025;
        pointer-events: none;
        z-index: 1;
        animation: lp-grain 6s steps(8) infinite;
      }
      @keyframes lp-fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes lp-fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes lp-sh {
        0% {
          background-position: -200% center;
        }
        100% {
          background-position: 200% center;
        }
      }
      @keyframes lp-drift {
        0% {
          transform: translate(0, 0) scale(1);
        }
        25% {
          transform: translate(80px, -60px) scale(1.1);
        }
        50% {
          transform: translate(-40px, -100px) scale(0.95);
        }
        75% {
          transform: translate(60px, 40px) scale(1.05);
        }
        100% {
          transform: translate(0, 0) scale(1);
        }
      }
      @keyframes lp-drift2 {
        0% {
          transform: translate(0, 0) scale(1);
        }
        33% {
          transform: translate(-70px, 80px) scale(1.08);
        }
        66% {
          transform: translate(50px, -50px) scale(0.92);
        }
        100% {
          transform: translate(0, 0) scale(1);
        }
      }
      @keyframes lp-progress {
        from {
          width: 0%;
        }
        to {
          width: 100%;
        }
      }
      @keyframes lp-sc {
        0% {
          opacity: 0;
          transform: translateY(-8px);
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      .lp-shim {
        background: linear-gradient(
          110deg,
          #e9cb8e 0%,
          #f5e6c3 20%,
          #e9cb8e 40%,
          #c9a44e 60%,
          #e9cb8e 80%,
          #f5e6c3 100%
        );
        background-size: 250% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: lp-sh 5s linear infinite;
      }
      .lp-orb {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        filter: blur(100px);
      }
      .lp-orb-drift {
        animation: lp-drift 20s ease-in-out infinite;
      }
      .lp-orb-drift2 {
        animation: lp-drift2 25s ease-in-out infinite;
      }
      .lp-vig {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse 100% 80% at 50% 50%,
            transparent 30%,
            rgba(10, 10, 11, 0.9) 100%
          ),
          linear-gradient(
            to bottom,
            rgba(10, 10, 11, 0.35) 0%,
            transparent 15%,
            transparent 90%,
            rgba(10, 10, 11, 1) 100%
          );
      }
      .lp-content {
        position: relative;
        z-index: 10;
        text-align: center;
        padding: clamp(40px, 8vw, 80px) clamp(24px, 5vw, 80px);
        max-width: 700px;
        width: 100%;
        margin: 0 auto;
        opacity: 0;
        animation: lp-fadeUp 1s ease 0.3s forwards;
      }
      .lp-badge-wrap {
        margin-bottom: 40px;
        opacity: 0;
        animation: lp-fadeIn 0.8s ease 0.2s forwards;
      }
      .lp-badge-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 24px;
        border-radius: 9999px;
        background: rgba(10, 10, 11, 0.5);
        border: 1px solid rgba(233, 203, 142, 0.12);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: border-color 0.3s;
      }
      .lp-badge-pill:hover {
        border-color: rgba(233, 203, 142, 0.3);
      }
      .lp-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        display: inline-block;
        box-shadow: 0 0 12px rgba(129, 199, 132, 0.5);
      }
      .lp-title {
        font-size: clamp(2.8rem, 9vw, 6rem);
        line-height: 0.9;
        letter-spacing: -0.06em;
        font-weight: 900;
        margin-bottom: 28px;
        opacity: 0;
        animation: lp-fadeUp 1.2s ease 0.5s forwards;
      }
      .lp-sub {
        font-size: clamp(1rem, 2vw, 1.2rem);
        font-weight: 300;
        color: rgba(255, 255, 255, 0.5);
        margin-bottom: 48px;
        line-height: 1.6;
        opacity: 0;
        animation: lp-fadeUp 1s ease 0.8s forwards;
      }
      .lp-progress-wrap {
        margin: 0 auto 16px;
        max-width: 320px;
        width: 100%;
        height: 2px;
        background: rgba(255, 255, 255, 0.06);
        border-radius: 9999px;
        overflow: hidden;
        opacity: 0;
        animation: lp-fadeIn 0.6s ease 1s forwards;
      }
      .lp-progress-bar {
        height: 100%;
        background: linear-gradient(90deg, var(--gold), #f5e6c3);
        border-radius: 9999px;
        width: 0%;
        animation: lp-progress 3s linear 1s forwards;
      }
      .lp-counter {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.72rem;
        color: var(--dim);
        margin-bottom: 40px;
        opacity: 0;
        animation: lp-fadeIn 0.6s ease 1s forwards;
      }
      .lp-cta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 32px;
        border-radius: 9999px;
        font-family: "Alexandria", sans-serif;
        font-weight: 600;
        font-size: 0.9rem;
        background: var(--gold);
        color: #0a0a0b;
        border: 1px solid var(--gold);
        color: black !important;
        transition: all 0.3s ease;
        cursor: pointer;
        text-decoration: none;
        opacity: 0;
        animation: lp-fadeIn 0.8s ease 1.2s forwards;
      }
      .lp-cta:hover {
        filter: brightness(1.1);
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(233, 203, 142, 0.2);
      }
      .lp-footer-links {
        display: flex;
        justify-content: center;
        gap: 32px;
        margin-top: 48px;
        align-items: center;
        opacity: 0;
        animation: lp-fadeIn 0.8s ease 1.4s forwards;
      }
      .lp-footer-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        color: var(--dim);
        transition: color 0.3s;
      }
      .lp-footer-link:hover {
        color: #1c1c1c;
      }
    </style>
  </head>
  <body>
    <div class="lp lp-grain">
      <div
        class="lp-orb lp-orb-drift"
        style="
          width: 600px;
          height: 600px;
          top: -10%;
          right: -5%;
          background: rgba(233, 203, 142, 0.08);
        "
      ></div>
      <div
        class="lp-orb lp-orb-drift2"
        style="
          width: 500px;
          height: 500px;
          bottom: 5%;
          left: -10%;
          background: rgba(104, 174, 201, 0.06);
        "
      ></div>
      <div class="lp-vig"></div>
      <div class="lp-content">
        <div class="lp-badge-wrap">
          <a href="https://librepower.org" class="lp-badge-pill">
            <span class="lp-dot"></span>
            <span class="lp-label" style="color: var(--gold)"
              >LibrePower AIX Repository</span
            >
            <span style="color: var(--dim)">—</span>
            <span style="font-size: 0.8rem; color: var(--muted)"
              >aix.librepower.org</span
            >
          </a>
        </div>
        <h1 class="lp-title">
          We've<br />
          <span class="lp-shim">moved.</span>
        </h1>
        <p class="lp-sub">
          This page has a new home at
          <strong style="color: #e0e0e0">librepower.org</strong>.<br />
          You'll be redirected automatically in a moment.
        </p>
        <div class="lp-progress-wrap">
          <div class="lp-progress-bar"></div>
        </div>
        <div class="lp-counter" id="lp-counter">Redirecting in 3…</div>
        <a
          href="https://librepower.org/stack/databases-operating-systems/aix/"
          class="lp-cta"
        >
          Take me there now
          <iconify-icon
            icon="lucide:arrow-right"
            style="font-size: 1rem"
          ></iconify-icon>
        </a>
      </div>
    </div>
    <script>
      (function () {
        var dest =
          "https://librepower.org/stack/databases-operating-systems/aix/";
        var secs = 3;
        var el = document.getElementById("lp-counter");
        var interval = setInterval(function () {
          secs--;
          if (secs <= 0) {
            clearInterval(interval);
            el.textContent = "Redirecting…";
            window.location.href = dest;
          } else {
            el.textContent = "Redirecting in " + secs + "…";
          }
        }, 1000);
      })();
    </script>
  </body>
</html>
